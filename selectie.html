<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleijenberg – Offerte Vera Polman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #E8DCC4 0%, #D4C4A8 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('Noise Seamless Vector Patterns copy.webp') repeat;
            background-size: 100px 100px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        #catalogus {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            background: white;
            padding: 30px 30px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(122, 80, 34, 0.15);
            border-top: 4px solid #7A5022;
        }

        h1 { color: #000000; font-size: 32px; margin-bottom: 5px; }

        .offerte-subtitle {
            color: #9B8B6F;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .offerte-info {
            display: flex;
            gap: 30px;
            padding: 15px;
            background: #F5F0E8;
            border-radius: 8px;
            border-left: 4px solid #7A5022;
            flex-wrap: wrap;
        }

        .offerte-info-item {
            font-size: 14px;
            color: #333333;
        }

        .offerte-info-item strong { color: #000000; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(122, 80, 34, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #E8DCC4;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(122, 80, 34, 0.2);
            border-color: #7A5022;
        }

        .product-number {
            position: absolute;
            top: 12px; left: 12px;
            background: rgba(122, 80, 34, 0.9);
            color: white;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            z-index: 1;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            background: #F5F0E8;
        }

        .product-info { padding: 20px; }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-sku {
            font-size: 12px;
            color: #9B8B6F;
            margin-bottom: 10px;
            font-family: monospace;
            background: #F5F0E8;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .product-prices {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #E8DCC4;
        }

        .product-price-excl {
            font-size: 22px;
            font-weight: 700;
            color: #7A5022;
        }

        .product-price-incl {
            font-size: 14px;
            color: #9B8B6F;
            margin-top: 2px;
        }

        .product-dimensions {
            color: #333333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .product-description {
            color: #333333;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .product-link {
            display: inline-block;
            margin-top: 10px;
            color: #7A5022;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .product-link:hover {
            color: #5D3C1A;
            text-decoration: underline;
        }

        /* Totaal sectie */
        .totaal-section {
            margin-top: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(122, 80, 34, 0.15);
            border-top: 4px solid #7A5022;
            overflow: hidden;
        }

        .totaal-header {
            padding: 20px 30px;
            background: #F5F0E8;
            border-bottom: 1px solid #E8DCC4;
        }

        .totaal-header h2 { color: #000000; font-size: 22px; }

        .totaal-lines { padding: 20px 30px; }

        .totaal-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #F5F0E8;
            font-size: 16px;
            color: #333;
        }

        .totaal-line:last-child { border-bottom: none; }
        .totaal-line.subtotaal { font-weight: 500; }
        .totaal-line.btw { color: #9B8B6F; font-size: 15px; }

        .totaal-line.totaal {
            border-top: 2px solid #7A5022;
            margin-top: 5px;
            padding-top: 15px;
            font-weight: 700;
            font-size: 20px;
            color: #000;
        }

        .totaal-line .label { flex: 1; }
        .totaal-line .amount { text-align: right; font-variant-numeric: tabular-nums; }

        .totaal-line.totaal .amount {
            color: #7A5022;
            font-size: 24px;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(93, 60, 26, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        #lightbox .close {
            position: absolute;
            top: 30px; right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: rgba(122, 80, 34, 0.8);
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #lightbox .close:hover { background: rgba(122, 80, 34, 1); }

        @media (max-width: 768px) {
            .product-grid { grid-template-columns: 1fr; }
            h1 { font-size: 24px; }
            .offerte-info { flex-direction: column; gap: 8px; }
            .totaal-line.totaal .amount { font-size: 20px; }
        }

        /* Kopieerbare tabel */
        .copy-section {
            margin-top: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(122, 80, 34, 0.15);
            border-top: 4px solid #7A5022;
            overflow: hidden;
        }

        .copy-header {
            padding: 20px 30px;
            background: #F5F0E8;
            border-bottom: 1px solid #E8DCC4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-header h2 { color: #000000; font-size: 22px; }

        .copy-btn {
            padding: 10px 20px;
            background: #7A5022;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: #5D3C1A; }
        .copy-btn.copied { background: #16a34a; }

        .copy-table-wrapper {
            padding: 20px 30px;
            overflow-x: auto;
        }

        .copy-table {
            width: auto;
            border-collapse: collapse;
            font-size: 14px;
        }

        .copy-table th {
            text-align: left;
            padding: 10px 15px;
            background: #F5F0E8;
            color: #5D3C1A;
            font-weight: 600;
            border-bottom: 2px solid #D4C4A8;
            white-space: nowrap;
        }

        .copy-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #F5F0E8;
            color: #333;
        }

        .copy-table tr:last-child td { border-bottom: none; }

        .copy-table .price-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .copy-table tfoot td {
            font-weight: 700;
            border-top: 2px solid #7A5022;
            padding-top: 12px;
        }

        .copy-table tfoot .totaal-row td {
            color: #7A5022;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="catalogus">
        <header>
            <h1>Offerte – Vera Polman</h1>
            <p class="offerte-subtitle">Bleijenberg – Natuurstenen potten & troggen</p>

            <div class="offerte-info">
                <div class="offerte-info-item"><strong>1</strong> product</div>
                <div class="offerte-info-item">Prijzen <strong>incl. &amp; excl. BTW</strong></div>
            </div>
        </header>

        <div class="product-grid" id="product-grid"></div>

        <div class="totaal-section">
            <div class="totaal-header">
                <h2>Totaaloverzicht</h2>
            </div>
            <div class="totaal-lines" id="totaal-lines"></div>
        </div>

        <div class="copy-section">
            <div class="copy-header">
                <h2>Prijsoverzicht</h2>
                <button class="copy-btn" onclick="copyTable()">Kopieer tabel</button>
            </div>
            <div class="copy-table-wrapper">
                <table class="copy-table" id="copy-table">
                    <thead>
                        <tr>
                            <th>Artikel</th>
                            <th class="price-col">Prijs</th>
                        </tr>
                    </thead>
                    <tbody id="copy-table-body"></tbody>
                    <tfoot id="copy-table-foot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // Product uit catalogus
        const productsData = [
            {
                "title": "Natuurstenen pot beige groot – Rond (50×60)",
                "price": 499.00,
                "sku": "LIP00017",
                "dimensions": "50 x 60 x 60",
                "description": "Mooie ronde schuin aflopende lichtbeige pot, met dikke randen voor een robuuste uitstraling. Deze pot is meer schoongemaakt voor een esthetische lichtere look, maar heeft nog steeds een lichte patina waardoor het zijn karakter behoudt.",
                "images": [
                    "https://bleijenberg.eu/wp-content/uploads/2025/02/Untitled-4-2.png",
                    "https://bleijenberg.eu/wp-content/uploads/2025/02/potten-27.jpg",
                    "https://bleijenberg.eu/wp-content/uploads/2025/02/potten-28.jpg"
                ],
                "url": "https://bleijenberg.eu/product/natuurstenen-pot-beige-groot-rond/"
            }
        ];

        // Extra regels (incl. BTW)
        const extraItems = [
            { title: "Omzetten fontein (incl. materialen en arbeid)", priceIncl: 195.00 }
        ];

        // Transport
        const transport = { title: "Bezorging", priceIncl: 75.00 };

        const BTW = 0.21;

        function toExcl(incl) { return incl / (1 + BTW); }
        function fmt(n) { return '€ ' + n.toFixed(2).replace('.', ','); }

        window.addEventListener('DOMContentLoaded', function() {
            displayProducts();
            displayTotals();
            displayCopyTable();
        });

        function displayProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = productsData.map((product, index) => {
                const exclPrice = toExcl(product.price);
                return `
                    <div class="product-card">
                        <div class="product-number">${index + 1}</div>
                        <div class="product-image-container">
                            <img src="${product.images[0]}"
                                 alt="${product.title}"
                                 class="product-image"
                                 onclick="openLightbox('${product.images[0]}')"
                                 onerror="this.src='https://via.placeholder.com/300x250?text=Geen+afbeelding'">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.title}</div>
                            <div class="product-sku">SKU: ${product.sku}</div>
                            <div class="product-dimensions">Afmetingen (HxLxB): ${product.dimensions} cm</div>
                            <div class="product-description">${product.description}</div>
                            <a href="${product.url}" target="_blank" class="product-link">Bekijk op website →</a>
                            <div class="product-prices">
                                <div class="product-price-excl">${fmt(exclPrice)} excl. BTW</div>
                                <div class="product-price-incl">${fmt(product.price)} incl. BTW</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayTotals() {
            const container = document.getElementById('totaal-lines');
            let subtotalIncl = 0;

            // Product(en)
            let lines = productsData.map((p, i) => {
                subtotalIncl += p.price;
                return `<div class="totaal-line subtotaal">
                    <span class="label">${p.sku}</span>
                    <span class="amount">${fmt(toExcl(p.price))}</span>
                </div>`;
            }).join('');

            // Extra items
            extraItems.forEach(item => {
                subtotalIncl += item.priceIncl;
                lines += `<div class="totaal-line subtotaal">
                    <span class="label">${item.title}</span>
                    <span class="amount">${fmt(toExcl(item.priceIncl))}</span>
                </div>`;
            });

            // Subtotaal
            lines += `<div class="totaal-line btw">
                <span class="label">Subtotaal excl. BTW</span>
                <span class="amount">${fmt(toExcl(subtotalIncl))}</span>
            </div>`;

            // Transport
            subtotalIncl += transport.priceIncl;
            lines += `<div class="totaal-line subtotaal" style="color: #5D3C1A;">
                <span class="label">${transport.title}</span>
                <span class="amount">${fmt(toExcl(transport.priceIncl))}</span>
            </div>`;

            // Totaal
            lines += `<div class="totaal-line totaal">
                <span class="label">Totaal excl. BTW</span>
                <span class="amount">${fmt(toExcl(subtotalIncl))}</span>
            </div>`;

            container.innerHTML = lines;
        }

        function displayCopyTable() {
            const tbody = document.getElementById('copy-table-body');
            const tfoot = document.getElementById('copy-table-foot');

            let subtotalIncl = 0;

            // Product(en)
            let rows = productsData.map(p => {
                subtotalIncl += p.price;
                return `<tr>
                    <td>${p.sku}</td>
                    <td class="price-col">${fmt(p.price)}</td>
                </tr>`;
            }).join('');

            // Extra items
            extraItems.forEach(item => {
                subtotalIncl += item.priceIncl;
                rows += `<tr>
                    <td>${item.title}</td>
                    <td class="price-col">${fmt(item.priceIncl)}</td>
                </tr>`;
            });

            // Bezorging
            subtotalIncl += transport.priceIncl;
            rows += `<tr>
                <td>${transport.title}</td>
                <td class="price-col">${fmt(transport.priceIncl)}</td>
            </tr>`;

            const btwAmount = subtotalIncl - toExcl(subtotalIncl);

            tbody.innerHTML = rows;

            tfoot.innerHTML = `<tr class="totaal-row">
                <td>Totaal</td>
                <td class="price-col">${fmt(subtotalIncl)}</td>
            </tr>
            <tr>
                <td style="color: #9B8B6F; font-weight: 400; font-size: 13px;">Waarvan 21% BTW</td>
                <td class="price-col" style="color: #9B8B6F; font-weight: 400; font-size: 13px;">${fmt(btwAmount)}</td>
            </tr>`;
        }

        function copyTable() {
            const table = document.getElementById('copy-table');
            const range = document.createRange();
            range.selectNode(table);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();

            const btn = document.querySelector('.copy-btn');
            btn.textContent = 'Gekopieerd!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Kopieer tabel';
                btn.classList.remove('copied');
            }, 2000);
        }

        function openLightbox(imageSrc) {
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('lightbox-img').src = imageSrc;
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
